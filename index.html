function tgl(gi){const k=cs+'|'+GS[gi];col[k]=!col[k];rl()}
V.ch=()=>{const gs=[...new Set(db.ch.filter(c=>c.s===cs).map(c=>c.g))];
return`<h2>Chapter Tracker</h2><div class=row>${S.map(s=>`<button class="${cs===s.k?'on':''}" onclick="cs='${s.k}';render()">${s.n}</button>`).join('')}</div>
<div class=row style="margin:8px 0"><input class=grow placeholder="🔍 Chapter search" value="${esc(fl)}" oninput="fl=this.value;rl()"><label><input type=checkbox ${inc?'checked':''} onchange="inc=this.checked?1:0;rl()">Sirf incomplete</label><button onclick="addG('${cs}')">+ Naya section/group</button></div>
<small class=mu>Syllabus: uploaded CBSE 2026-27 PDF se. Har naam edit/delete/add kar sakte ho.</small><div id=gl>${gl(gs)}</div>`};
function gl(gs){GS=gs;return gs.map((g,gi)=>{const q=JSON.stringify(g).replace(/"/g,'&quot;'),all=db.ch.map((c,i)=>[c,i]).filter(([c])=>c.s===cs&&c.g===g),av=Math.round(all.reduce((a,[c])=>a+pct(c),0)/(all.length||1)),items=all.filter(([c])=>(!fl||c.n.toLowerCase().includes(fl.toLowerCase()))&&(!inc||pct(c)<100)),shut=col[cs+'|'+g];
return`<div class=gh><span class=grow onclick="tgl(${gi})">${shut?'▸':'▾'} ${esc(g)} <small class=mu>${av}% · ${all.length}</small></span><button class=sm onclick="renG('${cs}',${q})">✏️</button><button class=sm onclick="delG('${cs}',${q})">🗑</button><button class=sm onclick="addCh('${cs}',${q})">＋</button></div>${shut?'':items.map(([c,i])=>card(c,i)).join('')||'<small class=mu>Kuch nahi mila</small>'}`}).join('')}
function rl(){$('#gl').innerHTML=gl([...new Set(db.ch.filter(c=>c.s===cs).map(c=>c.g))])}
function addCh(k,g){const n=prompt('Chapter ka naam:');if(n){db.ch.push({s:k,g,n,c:[0,0,0,0,0,0],note:'',how:''});save();render()}}
function addG(k){const g=prompt('Naye section ka naam (jaise "Extra Practice"):');if(g){const n=prompt('Pehle chapter ka naam:');if(n){db.ch.push({s:k,g,n,c:[0,0,0,0,0,0],note:'',how:''});save();render()}}}
function renG(k,g){const n=prompt('Section ka naya naam:',g);if(n){db.ch.forEach(c=>{if(c.s===k&&c.g===g)c.g=n});save();render()}}
function delG(k,g){if(confirm('Is section ke SAARE chapters aur unka progress delete ho jayega. Pakka?')){db.ch=db.ch.filter(c=>!(c.s===k&&c.g===g));save();render()}}
function delCh(i){if(confirm('Ye chapter delete karein? Progress bhi jayega.')){db.ch.splice(i,1);ex={};save();render()}}
// ---- diary
const F=(d,k,key,type,lab)=>{const v=(((db.d[d]||{}).s||{})[k]||{})[key],p=`d/${d}/s/${k}/${key}`;

return`<h2>Daily Diary</h2><div class=row><button onclick="sel=addD(sel,-1);render()">◀</button><input type=date value="${d}" onchange="if(this.value){sel=this.value;render()}"><button onclick="sel=addD(sel,1);render()">▶</button><button onclick="sel=today();render()">Aaj</button><b>${DAYN[pd(d).getDay()]}</b></div>
<small class=mu>Target aaj: ${tsum(d)} min | Hua: ${mins(d)} min | Sab kuch automatically save hota hai (is date ke naam se).</small>
${S.map(s=>{const cc=db.ch.filter(c=>c.s===s.k);return`<div class=card style="border-top:4px solid ${s.c}"><b style="color:${s.c}">${s.n}</b> <small class=mu>(target ${T[s.k]} min)</small><datalist id="dl_${s.k}">${cc.map(c=>`<option value="${esc(c.n)}">`).join('')}</datalist>
<div class=row>${F(d,s.k,'ch','t','Chapter')}${F(d,s.k,'tp','t','Topic studied')}${F(d,s.k,'nq','n','Questions solved')}${F(d,s.k,'t','n','Time spent (min)')}</div>
<div class=chk>${F(d,s.k,'l','cb','Lecture')}${F(d,s.k,'n','cb','NCERT reading')}${F(d,s.k,'q','cb','Question practice')}${F(d,s.k,'r','cb','Revision')}</div>
${F(d,s.k,'u','ta','Kya samajh aaya (What I understood)')}${F(d,s.k,'x','ta','Kya samajh nahi aaya')}${F(d,s.k,'p','ta','Kya baaki hai (Pending)')}</div>`}).join('')}
<div class=card><b>Revision / Mistake notebook time (min)</b> <input type=number min=0 data-p="d/${d}/rev" value="${+x.rev||''}"> <small class=mu>target ${T.r}</small> &nbsp; <b>Focus timer min</b>: ${+x.focus||0}<div><small>General daily notes</small><textarea data-p="d/${d}/n">${esc(x.n)}</textarea></div>
<button onclick="dl('report_'+sel+'.txt',rep(sel))">⬇ Is din ki report</button> <button onclick="clrDay()">🗑 Is din ka data delete</button></div>`};
function clrDay(){if(confirm(sel+' ka poora data delete ho jayega. Pakka?')){delete db.d[sel];save();render()}}
function rep(d){const x=db.d[d]||{s:{}};let r=`Study Report — ${d} (${DAYN[pd(d).getDay()]})\nTotal: ${mins(d)} min / target ${tsum(d)}\n\n`;S.forEach(s=>{const y=(x.s||{})[s.k]||{};r+=`== ${s.n} ==\nChapter: ${y.ch||'-'} | Topic: ${y.tp||'-'}\nLecture:${y.l?'Y':'N'} NCERT:${y.n?'Y':'N'} Practice:${y.q?'Y':'N'} Revision:${y.r?'Y':'N'} | Questions:${y.nq||0} | Time:${y.t||0} min\nSamjha: ${y.u||'-'}\nNahi samjha: ${y.x||'-'}\nPending: ${y.p||'-'}\n\n`});return r+`Revision min: ${x.rev||0}\nNotes: ${x.n||'-'}\n`}
// ---- calendar
V.cal=()=>{const y=calD.getFullYear(),m=calD.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c='',ms=0,mq=0,dd=0;
['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>c+=`<small class=mu style="text-align:center">${x}</small>`);for(let i=0;i<off;i++)c+='<span></span>';
for(let i=1;i<=n;i++){const d=y+'-'+p2(m+1)+'-'+p2(i),st=status(d);if(act(d)){dd++;ms+=mins(d);S.forEach(s=>mq+=+((((db.d[d]||{}).s||{})[s.k]||{}).nq)||0)}
c+=`<div class="${st} ${d===today()?'tdy':''}" onclick="sel='${d}';go('diary')">${i}</div>`}

<div class=cal style="margin:8px 0">${c}</div><span class="chip full">Poora target</span><span class="chip part">Aadha/kuch</span><span class="chip no">Koi record nahi</span><span class="chip fu">Future</span>
<div class=card>Is mahine: ${dd} din study, ${(ms/60).toFixed(1)} hrs, ${mq} questions</div>`};
// ---- analytics
V.ana=()=>{const tot=db.ch.length||1,cnt=j=>Math.round(db.ch.filter(c=>c.c[j]).length/tot*100),full=db.ch.filter(c=>pct(c)===100).length,none=db.ch.filter(c=>pct(c)===0).length;let q=0,mn=0;for(const d in db.d){mn+=mins(d);S.forEach(s=>q+=+((((db.d[d]||{}).s||{})[s.k]||{}).nq)||0)}
const t=today(),days=[...Array(14)].map((_,i)=>addD(t,i-13)),mx=Math.max(60,...days.map(mins)),miss=[];for(let d=db.start;d<t;d=addD(d,1))if(!act(d))miss.push(d);
return`<h2>Analytics</h2><div class=g><div class=card>Total chapters<div class=big>${db.ch.length}</div></div><div class=card>Poore complete<div class=big>${full}</div></div><div class=card>Adhure<div class=big>${db.ch.length-full-none}</div></div><div class=card>Pending (0%)<div class=big>${none}</div></div><div class=card>Questions solved<div class=big>${q}</div></div><div class=card>Study hours<div class=big>${(mn/60).toFixed(1)}</div></div></div>
<h3>Kaam ke hisaab se</h3><div class=card>${CK.map((l,j)=>`${l}: ${cnt(j)}%${bar(cnt(j))}`).join('')}</div>
<h3>Subject-wise</h3><div class=card>${S.map(s=>{const cc=db.ch.filter(c=>c.s===s.k),p=Math.round(cc.reduce((a,c)=>a+pct(c),0)/(cc.length||1)),ls=lastStudy(s.k);return`<b style="color:${s.c}">${s.n}</b> — ${p}% | last studied: ${ls||'abhi tak nahi'}${bar(p,s.c)}`}).join('')}</div>
<h3>Pichhle 14 din (minutes)</h3><div class=card><div style="display:flex;align-items:flex-end;gap:3px;height:110px">${days.map(d=>`<div title="${d}: ${mins(d)} min" onclick="sel='${d}';go('diary')" style="flex:1;cursor:pointer;background:var(--ac);height:${Math.max(2,mins(d)/mx*100)}%"></div>`).join('')}</div></div>
<h3>Bina entry wali dates (${miss.length})</h3><div class=card>${miss.map(d=>`<span class=chip onclick="sel='${d}';go('diary')">${d.slice(5)}</span>`).join('')||'Koi nahi 🎉'}<br><small class=mu>Ye sirf jaankari hai — jahan se chaho wapas shuru karo.</small></div>
<h3>Complete chapters</h3><div class=card>${db.ch.filter(c=>pct(c)===100).map(c=>`<span class=chip>${esc(c.n)}</span>`).join('')||'—'}</div>`};

V.week=()=>{const t=today(),days=[...Array(7)].map((_,i)=>addD(t,i-6)),T=tg(t);let q=0,tm=0;const sm={};S.forEach(s=>sm[s.k]=0);
days.forEach(d=>{tm+=mins(d);S.forEach(s=>{sm[s.k]+=smin(d,s.k);q+=+((((db.d[d]||{}).s||{})[s.k]||{}).nq)||0})});
const wd=pd(t),mon=addD(t,-((wd.getDay()+6)%7)),R=db.rv[mon]||{},mk=db.mk.filter(m=>m.d>=days[0]),tc={};mk.forEach(m=>tc[m.t]=(tc[m.t]||0)+1);

<div class=card>${S.map(s=>{const goal=T[s.k]*7;if(!goal)return'';const p=Math.round(sm[s.k]/goal*100);return`<b style="color:${s.c}">${s.n}</b>: ${sm[s.k]}/${goal} min — ${p>=70?'✅ kaafi dhyaan mila':'⚠ kam dhyaan mila → agle hafte +'+Math.ceil((goal-sm[s.k])/7/5)*5+' min/din'}${bar(p,s.c)}`}).join('')}</div>
<div class=card><b>Baar-baar hui galtiyan:</b> ${Object.entries(tc).map(([k,v])=>`${k} ×${v}`).join(', ')||'Mistake notebook me entries nahi'}</div>
<div class=card><b>Pending chapters:</b> ${db.ch.filter(c=>pct(c)<100).length} | <b>Complete:</b> ${db.ch.filter(c=>pct(c)===100).length}<br><small class=mu>Note: chapter kis din complete hua ye app track nahi karta; Diary me likho.</small></div>
<div class=card><b>Meri reflection</b><small>Kya acha gaya</small><textarea data-p="rv/${mon}/g">${esc(R.g)}</textarea><small>Kya mushkil tha</small><textarea data-p="rv/${mon}/h">${esc(R.h)}</textarea><small>Agle hafte ka plan</small><textarea data-p="rv/${mon}/p">${esc(R.p)}</textarea></div>`};

V.mk=()=>{const list=db.mk.map((m,i)=>[m,i]).filter(([m])=>(!mf.s||m.s===mf.s)&&(!mf.c||(m.c||'').toLowerCase().includes(mf.c.toLowerCase())));
return`<h2>Mistake Notebook</h2><div class=card><div class=row><input type=date id=md value="${today()}"><select id=ms>${S.map(s=>`<option value="${s.k}">${s.n}</option>`).join('')}</select><input id=mc class=grow placeholder="Chapter"><select id=mt>${MT.map(x=>`<option>${x}</option>`).join('')}</select></div>

${list.map(([m,i])=>`<div class=card style="border-left:4px solid ${sub(m.s).c}"><div class=row><b>${m.d}</b> ${sub(m.s).n} · ${esc(m.c)} · <i>${m.t}</i><select class=grow data-p="mk/${i}/st">${['Pending','Reattempted','Mastered'].map(x=>`<option ${m.st===x?'selected':''}>${x}</option>`).join('')}</select><button class=sm onclick="if(confirm('Delete?')){db.mk.splice(${i},1);save();render()}">🗑</button></div>

// ---- timer (survives closing), exam journey, sample papers, date sheet
const TTL=document.title;
function tmLeft(){const t=db.tm;return t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.left}
function tmS(){const l=tmLeft();return p2(Math.floor(l/60))+':'+p2(l%60)}
function tmTick(){const t=db.tm;if(t.end&&tmLeft()<=0)return tmDone();const a=$('#tmv'),b=$('#tmb');if(a)a.textContent=tmS();if(b)b.textContent=tmS();document.title=t.end?'⏱ '+tmS()+" · ka.p10prince'box":TTL}
function tmDone(){const t=db.tm,dt=fmt(new Date(t.end)),k='d/'+dt+'/s/'+t.k+'/t';setP(k,(+getP(k)||0)+t.len);setP('d/'+dt+'/focus',(+getP('d/'+dt+'/focus')||0)+t.len);t.end=0;t.left=t.len*60;save();render();tmTick();setTimeout(()=>alert('Session poora! '+t.len+' min diary me add ho gaye 🎉'),300)}
function tmGo(){const t=db.tm;if(t.end){t.left=tmLeft();t.end=0}else{if(t.left<=0)t.left=t.len*60;t.end=Date.now()+t.left*1000}save();render();tmTick()}
function tmSet(l){const t=db.tm;t.len=Math.max(1,+l||25);t.left=t.len*60;t.end=0;save();render();tmTick()}
function stg(){const n=db.ch.length||1,a=(i,j)=>Math.round(db.ch.reduce((x,c)=>x+c.c.slice(i,j).filter(Boolean).length/(j-i),0)/n*100),p=db.sp.length?Math.round(db.sp.reduce((x,q)=>x+(q.a+q.r)/2,0)/db.sp.length*100):0;return[a(0,3),a(3,6),p]}
function journey(){const g=stg();return[['1️⃣ Syllabus complete (Lecture · Reading · Notes)',g[0],'ch'],['2️⃣ Master karo: important questions (Practice · Revision · Test)',g[1],'ch'],['3️⃣ January sample papers',g[2],'sp']].map(x=>`<div onclick="go('${x[2]}')" style="cursor:pointer">${x[0]} — <b>${x[1]}%</b>${bar(x[1])}</div>`).join('')+(g.every(v=>v>=100)?'<b>🏆 Exam ke liye taiyar!</b>':'')}
function nx(){const t=today(),a=db.ds.filter(x=>x.d>=t).sort((p,q)=>p.d<q.d?-1:1)[0];return`<div class=card onclick="go('ds')" style="cursor:pointer">📅 ${a?`Agla exam: <b>${esc(a.n)}</b> — ${a.d} (${diff(t,a.d)} din baaki)`:'Exam date sheet'} <span class=mu>→ Date Sheet</span></div>`}
function addSp(k){db.sp.push({s:k,n:'Sample Paper '+(db.sp.filter(q=>q.s===k).length+1),a:0,r:0,sc:''});save();render()}

${S.map(s=>{const L=db.sp.map((q,i)=>[q,i]).filter(([q])=>q.s===s.k),p=L.length?Math.round(L.reduce((a,[q])=>a+(q.a+q.r)/2,0)/L.length*100):0;return`<div class=card style="border-top:4px solid ${s.c}"><div class=row><b class=grow style="color:${s.c}">${s.n} — ${p}%</b><button class=sm onclick="addSp('${s.k}')">+ Paper</button></div>${bar(p,s.c)}${L.map(([q,i])=>`<div class=row><input class=grow data-p="sp/${i}/n" value="${esc(q.n)}"><label><input type=checkbox data-rr=1 data-p="sp/${i}/a" ${q.a?'checked':''}>✍ Attempted</label><label><input type=checkbox data-rr=1 data-p="sp/${i}/r" ${q.r?'checked':''}>🔍 Reviewed</label><input style="width:76px" inputmode=decimal placeholder="Score" data-p="sp/${i}/sc" value="${esc(q.sc)}"><button class=sm onclick="delSp(${i})">🗑</button></div>`).join('')||'<small class=mu>Koi paper nahi — + Paper dabao</small>'}</div>`}).join('')}`};
V.ds=()=>{const t=today(),L=db.ds.map((x,i)=>[x,i]).sort((a,b)=>a[0].d<b[0].d?-1:1),f=L.find(([x])=>x.d>=t);return`<h2>Exam Date Sheet 2027</h2><div class=card><small class=mu>Ye date sheet tumhari bheji image (PW post) se li hai — CBSE ki official date sheet se ek baar zaroor match kar lena. Date/naam badal sakte ho.</small></div>
${L.map(([x,i])=>{const n=diff(t,x.d||t);return`<div class=card style="${f&&f[1]===i?'border:2px solid var(--gold)':''}"><div class=row><input class=grow data-p="ds/${i}/n" value="${esc(x.n)}"><input type=date data-rr=1 data-p="ds/${i}/d" value="${x.d}"><b>${n>0?n+' din baaki':n===0?'Aaj! 🍀':'ho chuka'}</b><button class=sm onclick="if(confirm('Delete?')){db.ds.splice(${i},1);save();render()}">🗑</button></div><small class=mu>${DAYN[pd(x.d||t).getDay()]}</small></div>`}).join('')}<button onclick="db.ds.push({n:'Naya exam',d:today()});save();render()">+ Exam add karo</button>`};
V.tm=()=>`<div class=card style="text-align:center;padding:24px 12px"><div class=big id=tmv style="font-size:58px">${tmS()}</div><div class=row style="justify-content:center;margin:12px 0"><select onchange="db.tm.k=this.value;save()">${S.map(s=>`<option value=${s.k} ${db.tm.k===s.k?'selected':''}>${s.n}</option>`).join('')}</select><select onchange="tmSet(this.value)">${[15,25,30,45,60,90].map(m=>`<option value=${m} ${db.tm.len===m?'selected':''}>${m} min</option>`).join('')}</select></div><div class=row style="justify-content:center"><button class=pri onclick="tmGo()">${db.tm.end?'⏸ Pause':'▶ Start'}</button><button onclick="tmSet(db.tm.len)">↺ Reset</button></div></div>`;
// ---- backup
V.bk=()=>`<h2>Backup & Restore</h2><div class=card>Data is browser (localStorage) me save hai. Browser data clear karne se ud sakta hai — <b>hafte me ek baar export zaroor karo.</b></div>
<div class=card><div class=row><button class=pri onclick="dl('study_backup_'+today()+'.json',JSON.stringify(db),'application/json')">⬇ Export all (JSON)</button><label>⬆ Import JSON: <input type=file accept=".json" onchange="imp(this.files[0])"></label><button onclick="csv()">⬇ Study history (CSV)</button><button onclick="dl('report_'+today()+'.txt',rep(today()))">⬇ Aaj ki report</button></div></div>
<div class=card><button onclick="reset()" style="color:#dc2626">⚠ Saara data reset</button></div>`;
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.ch||!x.d)throw 0;if(confirm('Abhi ka data replace ho jayega. Pehle export kar liya? Aage badhein?')){db=mig(x);save();render()}}catch(e){alert('File sahi nahi hai.')}};r.readAsText(f)}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';let o='date,subject,chapter,topic,lecture,ncert,practice,revision,questions,minutes,understood,not_understood,pending\n';Object.keys(db.d).sort().forEach(d=>S.forEach(s=>{const y=(db.d[d].s||{})[s.k];if(sact(y))o+=[d,s.n,y.ch,y.tp,y.l?1:0,y.n?1:0,y.q?1:0,y.r?1:0,y.nq||0,y.t||0,y.u,y.x,y.p].map(q).join(',')+'\n'}));dl('study_history.csv','\ufeff'+o,'text/csv')}
function reset(){if(confirm('SAARA data delete hoga. Pakka?')&&confirm('Aakhri baar: pehle backup export kiya?')){db=seed();save();render()}}
db.d[today()]=db.d[today()]||{n:'',s:{}};tmTick();render();
</script></body></html>
